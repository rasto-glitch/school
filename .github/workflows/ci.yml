name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + tenant-scoping)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev
      - run: npm run typecheck
      - name: Tenant-scoping check
        run: npm run check:tenant-scoping

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  e2e:
    name: E2E suite (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # E2E requires test-tenant credentials. The job is skipped unless the
    # repository has them configured as secrets, so first-time forks and
    # community PRs don't fail on missing creds.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: tests/e2e
    env:
      BASE_URL: ${{ secrets.E2E_BASE_URL }}
      TEST_SCHOOL_ABBREVIATION: ${{ secrets.E2E_SCHOOL_ABBREVIATION }}
      ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Write .env.test from secrets
        run: |
          {
            echo "BASE_URL=${BASE_URL}"
            echo "TEST_SCHOOL_ABBREVIATION=${TEST_SCHOOL_ABBREVIATION}"
            echo "ADMIN_USERNAME=${ADMIN_USERNAME}"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
          } > .env.test
      - run: npm run bootstrap
      - run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
