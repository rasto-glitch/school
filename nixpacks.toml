[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# --include=dev because Railway sets NODE_ENV=production, which otherwise
# skips devDependencies — and typescript lives there so tsc is needed for build.
cmds = ["npm --prefix backend install --include=dev"]

[phases.build]
cmds = ["npm --prefix backend run build"]

[start]
cmd = "node backend/dist/server.js"
